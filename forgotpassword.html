<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - S Studio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #090c14;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .fp-container {
            background: #111420;
            border: 1.5px solid #00f2fe;
            border-radius: 18px;
            padding: 35px 28px;
            width: 92%;
            max-width: 420px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 242, 254, 0.25);
            box-sizing: border-box;
            position: relative;
        }
        .fp-logo {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            border: 1.5px solid #00f2fe;
            padding: 2px;
            background: #161c28;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.35);
        }
        .fp-title {
            color: #00f2fe;
            font-size: 22px;
            margin: 0 0 4px 0;
            text-align: center;
            font-weight: 800;
            text-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
        }
        .fp-sub {
            color: #94a3b8;
            font-size: 12.5px;
            text-align: center;
            margin: 0 0 22px 0;
        }
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }
        .input-group label {
            display: block;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 11px 40px 11px 14px;
            background: #090d16;
            border: 1px solid #1f2738;
            border-radius: 8px;
            color: #ffffff;
            font-size: 13.5px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-group input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }
        .eye-btn {
            position: absolute;
            right: 12px;
            top: 33px;
            cursor: pointer;
            color: #94a3b8;
            user-select: none;
        }
        .btn-action {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #000000;
            font-weight: 800;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.35);
            margin-top: 5px;
            transition: transform 0.2s;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        }
        .status-box {
            text-align: center;
            font-size: 12px;
            margin-top: 14px;
            min-height: 18px;
            font-weight: 600;
        }
        .back-link {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
        }
        .back-link a {
            color: #00f2fe;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="fp-container">
    <div class="fp-logo">
        <img src="https://lh3.googleusercontent.com/d/1F4GgiyEVVlRXOWlmJ_IGBYpiTJH6Yot-" alt="S Studio Logo" style="width: 100%; height: 100%; object-fit: contain;">
    </div>
    <h2 class="fp-title">Reset Password</h2>
    <p class="fp-sub">Set a new password for your Register ID</p>

    <!-- Register ID Input -->
    <div class="input-group">
        <label>Your Register ID</label>
        <input type="text" id="resetRegId" placeholder="e.g., SSTU-1001" style="color: #00f2fe; font-weight: 700; text-transform: uppercase;">
    </div>

    <!-- New Password with Eye Icon -->
    <div class="input-group">
        <label>New Password</label>
        <input type="password" id="newPass" placeholder="Enter new password">
        <span class="eye-btn" onclick="togglePassView('newPass', this)">👁️</span>
    </div>

    <!-- Confirm Password with Eye Icon -->
    <div class="input-group">
        <label>Confirm New Password</label>
        <input type="password" id="confirmNewPass" placeholder="Re-enter new password">
        <span class="eye-btn" onclick="togglePassView('confirmNewPass', this)">👁️</span>
    </div>

    <button class="btn-action" id="btnUpdatePass" onclick="submitPasswordReset()">Update Now</button>

    <div class="status-box" id="statusMsg"></div>

    <div class="back-link">
        <a href="index.html">← Back to S Studio Login</a>
    </div>
</div>

<script>
    const S_STUDIO_AUTH_API = "https://script.google.com/macros/s/AKfycbwPbUN34AcyNgrHvxcLusf8gU0L3utFzd7COQ4P_vmyVwK4nEagr_iSyD__7Aj7K7e3/exec";

    function showStatus(msg, isSuccess) {
        const s = document.getElementById('statusMsg');
        s.innerText = msg;
        s.style.color = isSuccess ? '#10ac84' : '#ff4757';
    }

    function togglePassView(id, btn) {
        const input = document.getElementById(id);
        if (input.type === "password") {
            input.type = "text";
            btn.innerText = "🔒";
        } else {
            input.type = "password";
            btn.innerText = "👁️";
        }
    }

    async function submitPasswordReset() {
        const regId = document.getElementById('resetRegId').value.trim();
        const newPass = document.getElementById('newPass').value;
        const confirmPass = document.getElementById('confirmNewPass').value;

        if (!regId) return showStatus("Mee Register ID enter cheyandi!", false);
        if (!newPass) return showStatus("Kotha password enter cheyandi!", false);
        if (newPass !== confirmPass) return showStatus("Passwords match avvaledu!", false);

        const btn = document.getElementById('btnUpdatePass');
        btn.disabled = true;
        btn.innerText = "Updating Now...";
        showStatus("Password update chestunnamu...", true);

        try {
            const res = await fetch(S_STUDIO_AUTH_API, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: "direct_reset_password",
                    register_id: regId,
                    new_password: newPass
                })
            });
            const data = await res.json();
            btn.disabled = false;
            btn.innerText = "Update Now";

            if (data.status === "success") {
                showStatus("Password update successful! Login page ki velthunnamu...", true);
                
                // Register ID ni local memory lo save chesi, index.html login lo auto-fill avvelaa chesthundi
                localStorage.setItem("s_studio_last_login_id", regId);

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);
            } else {
                showStatus(data.message || "Password update kaledu!", false);
            }
        } catch (e) {
            btn.disabled = false;
            btn.innerText = "Update Now";
            showStatus("Network error. Malli prayatninchandi.", false);
        }
    }
</script>

</body>
</html>
