<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover S Studio Account &amp; Register ID | S Studio</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #F8FAFC;
            color: #0F172A;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .recovery-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 14px;
            max-width: 440px;
            width: 100%;
            padding: 28px 26px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }
    </style>
</head>
<body>

    <div class="recovery-card">
        <div style="margin-bottom: 18px;">
            <span style="display: inline-block; background: #EFF6FF; color: #2563EB; font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 5px; text-transform: uppercase;">
                Zero-Password Account Recovery
            </span>
            <h1 style="margin: 10px 0 6px 0; font-size: 21px; font-weight: 800; color: #0F172A;">
                Recover Your Register ID
            </h1>
            <p style="margin: 0; font-size: 13.5px; color: #475569; line-height: 1.6;">
                For your privacy, S Studio never stores passwords. Enter your registered <strong>Email ID</strong> or <strong>Mobile Number</strong> below, and we will send a direct login recovery link to your email.
            </p>
        </div>

        <div id="recoveryStatusBox" style="display: none; padding: 11px 13px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 14px;"></div>

        <form onsubmit="sendRecoveryLinkRequest(event)" style="display: flex; flex-direction: column; gap: 14px;">
            <div>
                <label style="display: block; font-size: 12.5px; font-weight: 700; color: #334155; margin-bottom: 6px;">Registered Email ID or Mobile Number</label>
                <input type="text" id="recoveryQueryInput" required placeholder="e.g. you@gmail.com or 9876543210" style="width: 100%; padding: 10px 12px; border: 1px solid #CBD5E1; border-radius: 7px; font-size: 14px;">
            </div>

            <button type="submit" id="recoverySendBtn" style="background: #2563EB; color: #FFFFFF; border: none; padding: 11px; border-radius: 7px; font-size: 14px; font-weight: 700; cursor: pointer;">
                Send Recovery Link to Email
            </button>
        </form>

        <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid #E2E8F0; text-align: center;">
            <a href="index.html" style="color: #2563EB; text-decoration: none; font-size: 13px; font-weight: 700;">
                ← Return to S Studio Home
            </a>
        </div>
    </div>

    <script>
        const S_STUDIO_RECOVERY_API = "https://script.google.com/macros/s/AKfycbwPbUN34AcyNgrHvxcLusf8gU0L3utFzd7COQ4P_vmyVwK4nEagr_iSyD__7Aj7K7e3/exec";

        async function sendRecoveryLinkRequest(e) {
            e.preventDefault();
            const query = document.getElementById("recoveryQueryInput").value.trim();
            const btn = document.getElementById("recoverySendBtn");
            const box = document.getElementById("recoveryStatusBox");

            btn.disabled = true;
            btn.innerText = "Sending Recovery Link...";
            box.style.display = "none";

            const baseHomeUrl = window.location.href.replace("forgotpassword.html", "index.html").split("?")[0];

            try {
                const res = await fetch(S_STUDIO_RECOVERY_API, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "send_recovery_link",
                        query: query,
                        siteUrl: baseHomeUrl
                    })
                });
                const data = await res.json();

                box.style.display = "block";
                if (data.status === "success") {
                    box.style.background = "#ECFDF5";
                    box.style.color = "#059669";
                    box.style.border = "1px solid #6EE7B7";
                    box.innerHTML = data.message;
                } else {
                    box.style.background = "#FEF2F2";
                    box.style.color = "#DC2626";
                    box.style.border = "1px solid #FCA5A5";
                    box.innerHTML = data.message || "Account not found.";
                }
            } catch (err) {
                box.style.display = "block";
                box.style.background = "#FEF2F2";
                box.style.color = "#DC2626";
                box.innerHTML = "Network error connecting to server.";
            } finally {
                btn.disabled = false;
                btn.innerText = "Send Recovery Link to Email";
            }
        }
    </script>
</body>
</html>
